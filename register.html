
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel ="icon" type = "img/png" href = "images.png">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="students.html">Students</a>
        <a href="register.html">Register</a>
        <a href="contact.html">Contact</a>
    </nav>

    <div class="container">
        <hr>
        <h1>Student Registration Form</h1>
<hr>
        <form action="#" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="mobile">Mobile No:</label>
            <input type="number" id="mobile" name="mobile" required><br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required><br><br>

            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="Male" required> <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="Female" required> <label for="female">Female</label><br><br>

            <label for="course">Course Selection:</label>
            <select id="course" name="course">
                <option value="computer_science">Computer Science</option>
                <option value="mechanical_engineering">Mechanical Engineering</option>
                <option value="civil_engineering">Civil Engineering</option>
                <option value="electrical_engineering">Electrical Engineering</option>
                <option value="data_science">Data Science</option>
            </select><br><br>

            <label for="hobbies">Hobbies:</label>
            <input type="checkbox" id="reading" name="hobbies" value="Reading"> <label for="reading">Reading</label>
            <input type="checkbox" id="sports" name="hobbies" value="Sports"> <label for="sports">Sports</label>
            <input type="checkbox" id="music" name="hobbies" value="Music"> <label for="music">Music</label><br><br>

            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="2" required></textarea><br><br>

            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </form>
    </div>
</body>
</html>
